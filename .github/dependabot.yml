version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # openai 3.x swaps httpx for httpx2; the gateway's transports are httpx
      - dependency-name: openai
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
