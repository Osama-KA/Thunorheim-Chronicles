[project]
name = "thunorheim"
version = "0.2.0"
description = "A persistent-memory narrative RPG: LLM agents reason, a deterministic validated core owns the truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.41.1,<4",  # 3.x moves to httpx2; the gateway's transports are httpx
    "pydantic>=2.13",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long prompt strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["thunorheim", "tests", "main.py", "app.py"]

[[tool.mypy.overrides]]
module = ["thunorheim.llm", "thunorheim.lore", "thunorheim.schemas"]  # new code is typed strictly
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
