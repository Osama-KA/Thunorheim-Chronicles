[project]
name = "thunorheim"
version = "0.2.0"
description = "A persistent-memory narrative RPG: LLM agents reason, a deterministic validated core owns the truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects==2.2.0",
    "azure-identity>=1.25.3",
    "azure-search-documents==12.1.0b2",
    "openai>=2.41.1,<4",  # 3.x swaps httpx for httpx2; azure-ai-projects still imports httpx
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long prompt strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["thunorheim", "tests", "main.py", "app.py"]
